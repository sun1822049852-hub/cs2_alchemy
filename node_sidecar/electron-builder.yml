appId: com.cs2alchemy.client
productName: CS Tools
executableName: CS Tools
directories:
  output: dist
  buildResources: build
icon: build/icon.ico
files:
  - electron-main.js
  - electron-preload.js
  - fetch_component_contents.js
  - package.json
  - src/**
  - ui/**
extraResources:
  - from: build/client_config.release.json
    to: client_config.json
  - from: build/icon.ico
    to: app-icon.ico
  - from: ../schema_cache.json
    to: schema_cache.json
  - from: ../csgo_skins.db
    to: csgo_skins.db
  - from: ../shared
    to: shared
  - from: ../keys
    to: keys
win:
  signAndEditExecutable: false
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CS Tools
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  runAfterFinish: true
