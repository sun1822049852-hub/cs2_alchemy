<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 管理界面 (Node)</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="theme-inkblue">
    <div class="layout">
      <div id="navShell" class="nav-shell">
        <button id="navRailTrigger" class="nav-rail-trigger" type="button" aria-label="展开功能导航" aria-controls="mainSidebar" aria-expanded="false">
          <span class="nav-rail-arrow" aria-hidden="true"></span>
        </button>
        <aside class="sidebar" id="mainSidebar">
          <div class="sidebar-title">功能导航</div>
          <button class="nav-btn active" data-page="accountPage" id="navAccount">账号管理</button>
          <button class="nav-btn" data-page="inventoryPage" id="navInventory">库存总览</button>
          <button class="nav-btn" data-page="craftPage" id="navCraft">炼金汰换</button>
        </aside>
      </div>

      <main class="workspace">
        <section class="page" id="accountPage">
          <div class="account-grid">
            <section class="panel account-form-panel">
              <h2>账号管理</h2>
              <div class="form-row">
                <label for="accountUsername">Steam 账号</label>
                <input id="accountUsername" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
              </div>
              <div class="form-row">
                <label for="accountPassword">密码</label>
                <input id="accountPassword" type="password" autocomplete="new-password" />
              </div>
              <div class="form-row">
                <label for="accountTotp">令牌码</label>
                <input id="accountTotp" type="text" maxlength="6" autocapitalize="characters" autocomplete="one-time-code" spellcheck="false" />
              </div>
              <div class="form-row">
                <label for="accountRemark">备注名</label>
                <input id="accountRemark" type="text" autocomplete="off" autocorrect="off" spellcheck="false" />
              </div>
              <div class="account-actions">
                <button id="loginSaveBtn">登录并保存</button>
                <button id="clearAccountBtn">清空输入</button>
              </div>
              <div class="tips">
                规则：<br />
                1. 成功获取 token 才保存账号。<br />
                2. 失败只显示原因，不保存账号。<br />
                3. 备注名在右侧列表里编辑。
              </div>
              <div class="status-box">
                <div class="status-title">状态</div>
                <div id="accountStatus" class="status-text">准备就绪</div>
              </div>
            </section>

            <section class="panel account-list-panel">
              <h2>已保存账号</h2>
              <div id="savedAccountsWrap" class="saved-accounts"></div>
            </section>
          </div>
        </section>

        <section class="page hidden" id="inventoryPage">
          <header class="topbar">
            <h1>库存总览</h1>
            <div class="topbar-meta">
              <span id="fetchTimeText">库存获取时间：-</span>
              <div class="account-tools">
                <label for="accountSelect">账号</label>
                <select id="accountSelect"></select>
                <span class="status status-disconnected" id="statusText">未连接</span>
                <button id="refreshBtn">连接并刷新库存信息</button>
                <button id="disconnectBtn">断开连接</button>
              </div>
            </div>
          </header>

          <section class="panel hidden" id="filterDrawer">
            <div class="filter-menu-shell">
              <div class="filter-menu-nav">
                <button id="filterNavWear" class="filter-nav-item active" type="button" data-panel="wear">磨损筛选</button>
                <button id="filterNavRarity" class="filter-nav-item" type="button" data-panel="rarity">稀有度筛选</button>
                <button id="filterNavCollection" class="filter-nav-item" type="button" data-panel="collection">收藏品筛选</button>
              </div>
              <div class="filter-menu-sub">
                <div id="filterPanelWear" class="filter-sub-panel">
                  <div class="filter-sub-title">磨损范围</div>
                  <div class="row">
                    <select id="wearMin" class="small"></select>
                    <span>-</span>
                    <select id="wearMax" class="small"></select>
                  </div>
                  <span id="wearHint" class="hint filter-hint"></span>
                </div>
                <div id="filterPanelRarity" class="filter-sub-panel hidden">
                  <div class="filter-sub-title">稀有度筛选 <span id="raritySummary" class="muted">全部</span></div>
                  <div class="menu-actions">
                    <button type="button" id="raritySelectAll">全选</button>
                    <button type="button" id="rarityClear">清空</button>
                  </div>
                  <div id="rarityMenu" class="menu-list"></div>
                </div>
                <div id="filterPanelCollection" class="filter-sub-panel hidden">
                  <div class="filter-sub-title">收藏品筛选 <span id="collectionSummary" class="muted">全部</span></div>
                  <div class="menu-actions">
                    <button type="button" id="collectionSelectAll">全选</button>
                    <button type="button" id="collectionClear">清空</button>
                  </div>
                  <div id="collectionMenu" class="menu-list"></div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel" id="componentPanel">
            <div class="row component-toolbar">
              <button id="toggleFilterBtn" class="icon-btn filter-toggle-btn" type="button" title="展开筛选" aria-label="展开筛选">
                <span class="filter-glyph" aria-hidden="true"></span>
              </button>
              <div class="view-mode-switch" role="group" aria-label="切换视图">
                <button id="modeToggleBtn" class="view-mode-btn active" type="button" title="列表视图" aria-label="切换视图">
                  <span id="modeToggleGlyph" class="mode-glyph mode-glyph-list" aria-hidden="true"></span>
                </button>
              </div>
              <label class="component-toolbar-search-label">搜索</label>
              <input id="searchInput" class="component-toolbar-search-input" placeholder="名称/中文名/英文名/market hash" />
              <label><span class="icon-box" aria-hidden="true"></span> 库存管理</label>
              <select id="componentSelect"></select>
              <button id="componentDepositBtn">存入组件</button>
              <button id="componentWithdrawBtn">取出选中</button>
              <label id="showComponentItemsWrap" class="inline"><input type="checkbox" id="showComponentItems" />显示组件内物品</label>
              <div class="component-toolbar-right">
                <span id="summaryText" class="summary-ghost" aria-live="polite">尚未加载库存</span>
                <span id="componentAvailableHint" class="component-available-badge" title="当前实际可从组件中取出的物品数量">可取出：1000</span>
                <span id="componentHint" class="component-capacity-badge" title="库存容量">0/1000</span>
                <div class="craft-settings-wrap component-craft-settings-wrap">
                  <button id="componentCraftSettingsBtn" class="icon-btn craft-settings-btn" type="button" title="炼金设置" aria-label="炼金设置">
                    <span class="craft-gear-glyph" aria-hidden="true"></span>
                  </button>
                  <div id="componentCraftSettingsPanel" class="craft-settings-panel hidden">
                    <label class="inline"><span>使用组件中物品</span><input id="componentCraftUseComponentItems" type="checkbox" /></label>
                    <label class="inline"><span>显示种子</span><input id="componentCraftShowSeed" type="checkbox" /></label>
                    <label class="inline"><span>显示完整磨损</span><input id="componentCraftShowFullWear" type="checkbox" /></label>
                    <label class="inline"><span>显示冷却时间</span><input id="componentCraftShowCoolingTime" type="checkbox" /></label>
                    <label class="inline"><span>磨损偏移阈值(%)</span><input id="componentCraftAssistWearOffsetPct" class="craft-settings-number" type="number" min="0" max="100" step="0.1" /></label>
                    <div id="componentCraftCoolingHint" class="muted">冷却中可选：无</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <main id="listWrap" class="list-wrap"></main>

          <section id="componentTaskFloat" class="task-float hidden" aria-live="polite">
            <div class="task-float-title">组件任务</div>
            <div id="componentTaskInfo" class="muted">执行中：无</div>
            <div id="componentTaskQueueList" class="task-queue-list"></div>
            <div class="row task-float-actions">
              <button id="componentTaskCancelBtn">取消选中排队任务</button>
            </div>
          </section>

          <section id="targetComponentDrawer" class="component-target-drawer hidden" aria-live="polite" aria-label="选择目标组件">
            <div class="drawer-head">
              <div class="drawer-title">选择目标组件</div>
              <button id="targetComponentDrawerClose" type="button" class="drawer-close-btn" aria-label="关闭">×</button>
            </div>
            <div id="targetComponentDrawerHint" class="drawer-hint muted">请选择要存入的目标组件</div>
            <select id="targetComponentDrawerSelect" class="drawer-select-list" size="8"></select>
            <div class="row drawer-actions">
              <button id="targetComponentDrawerCancel" type="button">取消</button>
              <button id="targetComponentDrawerConfirm" type="button">确认存入</button>
            </div>
          </section>

        </section>

        <div id="remarkModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="remarkModalTitle">
          <div class="modal-card remark-modal-card">
            <div class="modal-header">
              <h3 id="remarkModalTitle">修改备注名</h3>
              <button id="remarkModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
            </div>
            <div class="form-row">
              <label for="remarkModalInput">备注名</label>
              <input id="remarkModalInput" type="text" />
            </div>
            <div class="row modal-actions">
              <button id="remarkModalSaveBtn" type="button">保存</button>
              <button id="remarkModalCancelBtn" type="button">取消</button>
            </div>
          </div>
        </div>

        <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
          <div class="modal-card confirm-modal-card">
            <div class="modal-header">
              <h3 id="confirmModalTitle">请确认操作</h3>
              <button id="confirmModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
            </div>
            <div id="confirmModalMessage" class="confirm-modal-message">确认继续吗？</div>
            <div class="row modal-actions">
              <button id="confirmModalCancelBtn" type="button">取消</button>
              <button id="confirmModalConfirmBtn" class="confirm-modal-confirm-btn" type="button">确认</button>
            </div>
          </div>
        </div>

        <section class="page hidden" id="craftPage">
          <header class="topbar craft-topbar">
            <div class="topbar-meta">
              <span id="craftTopFetchTimeText">库存获取时间：-</span>
              <div class="account-tools">
                <label for="craftAccountSelect">账号</label>
                <select id="craftAccountSelect"></select>
                <span class="status status-disconnected" id="craftTopStatusText">未连接</span>
                <button id="craftRefreshBtn">连接并刷新库存信息</button>
                <button id="craftDisconnectBtn">断开连接</button>
              </div>
            </div>
          </header>
          <div id="craftLayout" class="craft-layout">
            <section id="craftLeftPanel" class="panel craft-left-panel">
              <div class="row craft-left-head">
                <span id="craftSelectionTitle">主库存可炼金物品</span>
                <div class="craft-settings-wrap">
                  <button id="craftSettingsBtn" class="icon-btn craft-settings-btn" type="button" title="炼金设置" aria-label="炼金设置">
                    <span class="craft-gear-glyph" aria-hidden="true"></span>
                  </button>
                  <div id="craftSettingsPanel" class="craft-settings-panel hidden">
                    <label class="inline"><span>使用组件中物品</span><input id="craftUseComponentItems" type="checkbox" /></label>
                    <label class="inline"><span>使用冷却中的物品</span><input id="craftIncludeCooling" type="checkbox" /></label>
                    <label class="inline"><span>显示种子</span><input id="craftShowSeed" type="checkbox" /></label>
                    <label class="inline"><span>显示完整磨损</span><input id="craftShowFullWear" type="checkbox" /></label>
                    <label class="inline"><span>磨损偏移阈值(%)</span><input id="craftAssistWearOffsetPct" class="craft-settings-number" type="number" min="0" max="100" step="0.1" /></label>
                    <div id="craftCoolingHint" class="muted">冷却中可选：无</div>
                  </div>
                </div>
              </div>
              <div id="craftSelectionList" class="craft-selection-list"></div>
              <div id="craftAssistOverlay" class="craft-assist-overlay hidden" aria-live="polite" aria-label="辅助选材覆盖层">
                <div id="craftAssistOverlayHandle" class="craft-assist-overlay-handle" title="拖拽调整辅助选材覆盖范围" aria-hidden="true"></div>
                <button id="craftAssistCloseBtn" type="button" class="craft-assist-close craft-assist-close-floating" aria-label="关闭辅助选材">×</button>
                <div id="craftAssistPanel" class="craft-assist-panel" aria-label="辅助选材面板">
                  <div id="craftAssistBusyMask" class="craft-assist-busy-mask hidden" aria-hidden="true">
                    <div class="craft-assist-busy-card">
                      <div id="craftAssistBusyMaskTitle" class="craft-assist-busy-title">正在辅助选材</div>
                      <div id="craftAssistBusyMaskDetail" class="craft-assist-busy-detail">请稍候...</div>
                    </div>
                  </div>
                  <div id="craftAssistContent" class="craft-assist-line craft-assist-content">
                    <div class="craft-assist-main-col">
                      <div class="craft-assist-main-tools">
                        <label class="craft-assist-field craft-assist-target-field">
                          <span>目标相对磨损</span>
                          <input id="craftAssistTargetWear" type="text" inputmode="decimal" />
                        </label>
                        <div class="craft-assist-field craft-assist-filter-mode">
                          <span>筛选磨损</span>
                          <div class="craft-assist-mode-toggle" role="group" aria-label="筛选磨损模式">
                            <label class="craft-assist-mode-option">
                              <input id="craftAssistFilterModeRelative" type="radio" name="craftAssistFilterMode" value="relative" />
                              <span>相对</span>
                            </label>
                            <label class="craft-assist-mode-option">
                              <input id="craftAssistFilterModeAbsolute" type="radio" name="craftAssistFilterMode" value="absolute" />
                              <span>绝对</span>
                            </label>
                          </div>
                        </div>
                        <button id="craftAssistPresetSaveBtn" class="btn-primary craft-assist-save-btn" type="button">保存当前</button>
                        <button id="craftAssistApplyBtn" class="btn-primary craft-assist-apply-btn" type="button">按配置选材</button>
                      </div>
                      <button id="craftAssistSelectBox" class="craft-assist-select-box merged" type="button" aria-label="悬停选择父类材料">
                        <span id="craftAssistSelectText">尚未选择父类材料</span>
                        <span id="craftAssistRoleSplit" class="craft-assist-role-split hidden" aria-hidden="true">
                          <span class="role-main">主料</span>
                          <span class="role-aux">辅料</span>
                        </span>
                      </button>
                      <div id="craftAssistPicker" class="craft-assist-picker hidden"></div>
                      <div id="craftAssistList" class="craft-assist-list"></div>
                    </div>
                    <div id="craftAssistSplitBar" class="craft-assist-split-bar" title="拖拽调整配置区宽度" aria-hidden="true"></div>
                    <aside id="craftAssistPresetPanel" class="craft-assist-preset-panel" aria-label="辅助选材方案列表">
                      <div id="craftAssistPresetList" class="craft-assist-preset-list"></div>
                    </aside>
                  </div>
                </div>
              </div>
            </section>
            <div id="craftSplitBar" class="craft-split-bar" title="拖拽调整左右区域宽度" aria-hidden="true"></div>
            <section id="craftRightPanel" class="panel craft-right-panel">
              <div class="row craft-queue-header">
                <div class="craft-queue-header-spacer" aria-hidden="true"></div>
                <div class="craft-queue-header-actions" aria-label="配方操作">
                  <button id="craftAssistToggleBtn" class="icon-btn craft-queue-icon-btn craft-assist-toggle-btn" type="button" title="快捷选材" aria-label="快捷选材">
                    <span class="craft-assist-glyph" aria-hidden="true"></span>
                  </button>
                  <button id="craftAddRecipeBtn" class="icon-btn craft-queue-icon-btn craft-add-recipe-btn" type="button" title="添加配方" aria-label="添加配方">
                    <span class="craft-plus-glyph" aria-hidden="true"></span>
                  </button>
                  <button id="craftClearQueueBtn" class="icon-btn craft-queue-icon-btn craft-clear-queue-btn" type="button" title="清空配方" aria-label="清空配方">
                    <span class="craft-close-glyph" aria-hidden="true"></span>
                  </button>
                </div>
              </div>
              <div class="craft-queue-shell">
                <div id="craftQueueList" class="craft-queue-list"></div>
                <div class="row craft-queue-run-row">
                  <button id="craftExecuteQueueBtn" class="icon-btn craft-execute-btn" type="button" title="执行配方" aria-label="执行配方">
                    <span class="craft-play-glyph" aria-hidden="true"></span>
                  </button>
                </div>
              </div>
            </section>
          </div>
        </section>

        <div id="craftAssistPresetModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="craftAssistPresetModalTitle">
          <div class="modal-card craft-assist-preset-modal-card">
            <div class="modal-header">
              <h3 id="craftAssistPresetModalTitle">保存辅助配置</h3>
              <button id="craftAssistPresetModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
            </div>
            <div class="form-row">
              <label for="craftAssistPresetModalInput">配置名称</label>
              <input id="craftAssistPresetModalInput" type="text" maxlength="24" placeholder="请输入配置名称" />
            </div>
            <div class="row modal-actions">
              <button id="craftAssistPresetModalSaveBtn" type="button">保存配置</button>
              <button id="craftAssistPresetModalCancelBtn" type="button">取消</button>
            </div>
          </div>
        </div>

        <section id="craftExecutionOverlay" class="craft-execution-overlay hidden" aria-live="polite" aria-label="炼金执行进度">
          <div class="craft-execution-card">
            <div id="craftExecutionOverlayTitle" class="craft-execution-title">正在执行炼金任务</div>
            <div id="craftExecutionOverlayDetail" class="craft-execution-detail">请稍候...</div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
