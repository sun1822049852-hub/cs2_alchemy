server {
    listen __PUBLIC_HOST_PORT__ default_server;
    server_name _;

    location = /api/health {
        proxy_pass http://127.0.0.1:__ADMIN_HOST_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:__ADMIN_HOST_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin {
        return 404;
    }

    location ^~ /api/admin/ {
        return 404;
    }

    location = /api/mail/config {
        return 404;
    }

    location = /api/dev/mail/test {
        return 404;
    }

    location / {
        return 404;
    }
}
